[project]
name = "omniatlas"
version = "0.1.0"
description = "OmniAtlas Linter — incremental static analysis enforcing the BLUEPRINT.md meta-specification."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.26.8",
]

[project.scripts]
omni-atlas = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/main.py"]
